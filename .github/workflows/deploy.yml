name: Deploy to SysLab

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # Build and restart happen on the SysLab server itself (self-hosted
      # Docker, no registry involved) — triggered over the same ops HTTP API
      # the syslab_run MCP tool uses (server.systemslab.app, bearer token
      # auth). No GCP credentials, no Artifact Registry, no Cloud Run.
      - name: Deploy on SysLab
        env:
          OPS_TOKEN: ${{ secrets.SYSLAB_OPS_TOKEN }}
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 620 \
            -X POST "https://server.systemslab.app/api/run" \
            -H "Authorization: Bearer ${OPS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "command": "cd /home/syslab/database-agent && git fetch origin main && git reset --hard origin/main && cd /home/syslab/syslab-server && docker compose build database-agent && docker compose up -d database-agent",
              "timeout": 600
            }')

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body"

          if [ "$http_code" != "200" ]; then
            echo "Deploy request failed with HTTP $http_code"
            exit 1
          fi

          exit_code=$(echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).exit_code)}catch{console.log(1)}})")
          if [ "$exit_code" != "0" ]; then
            echo "Remote command exited with code $exit_code"
            exit 1
          fi

      - name: Verify deployment
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://chat.systemslab.app/api/v1/health")
          echo "Health check: HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "Site did not respond as expected after deploy"
            exit 1
          fi
