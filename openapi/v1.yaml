openapi: 3.1.0

# ============================================================================
# This file is the contract. It is the source of truth for the v1 API — the
# route handlers under app/api/v1 implement it, and scripts/check-api-compat.mjs
# diffs it against openapi/v1.released.yaml to block breaking changes in CI.
#
# Change the spec first, then the code. Never the other way around.
#
# Cross-cutting conventions, decided once and applied to every endpoint:
#   - JSON field names are snake_case. Always. No exceptions.
#   - Timestamps are RFC 3339 / ISO 8601 in UTC, e.g. 2026-08-08T14:05:22Z.
#   - IDs are opaque prefixed strings (conn_, conv_, run_…). Never assume a
#     format beyond "string" — the prefix is for humans reading logs.
#   - Lists are cursor-paginated: ?limit=&cursor= -> {data, has_more, next_cursor}.
#   - Every error is the Error schema. A 200 carrying {"error": …} is a bug.
#   - Every POST that creates something takes an Idempotency-Key header.
#   - Every response carries rate-limit headers and a request_id.
# ============================================================================

info:
  title: Database Agent API
  version: "1.0.0"
  description: |
    The backend for the Database Agent workspace: multi-tenant database
    connections, agent runs over those connections, conversations, and the
    playbook that shapes how the agent answers.

    ## Authentication

    Send an API key as a bearer token:

    ```
    Authorization: Bearer dak_live_…
    ```

    The key identifies the tenant and the acting user. Every resource is scoped
    to the key's tenant — there is no cross-tenant read, ever. Keys carry
    scopes; an endpoint's required scopes are listed on the operation.

    ## Pagination

    Collection endpoints return `{data, has_more, next_cursor}`. To get the next
    page, pass `next_cursor` back as `cursor`. Cursors are opaque — do not parse
    them. A cursor encodes the sort order it was created with; reusing it with a
    different `order` is a `400`.

    ## Idempotency

    Send `Idempotency-Key` on every create. Replaying the same key with the same
    request body within 24 hours returns the original response and sets
    `Idempotent-Replay: true`. Replaying it with a *different* body is a `409` —
    that means a bug on the client, not a retry.

    ## Rate limits

    Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and
    `X-RateLimit-Reset` (unix seconds). On breach you get a `429` with
    `Retry-After` in seconds. Limits are per tenant per endpoint class.

    ## Versioning

    Breaking changes get a new major version in the path (`/v2`). Everything
    backward-compatible ships continuously within `/v1`. Endpoints scheduled for
    removal return `Deprecation` and `Sunset` headers for the whole runway
    before they go away. See docs/api/versioning.md.
  contact:
    name: Database Agent Platform
  license:
    name: Proprietary

servers:
  - url: /api
    description: Same-origin (the Next.js app serves the API under /api)
  - url: https://api.example.com
    description: Production gateway

security:
  - bearerAuth: []

tags:
  - name: Meta
    description: Health and caller identity.
  - name: Connections
    description: Database connections the agent can query.
  - name: Model providers
    description: Which AI answers, and with which credential.
  - name: Queries
    description: Direct SQL execution against a connection.
  - name: Conversations
    description: Chat threads and their messages.
  - name: Runs
    description: Agent runs — a question in, an answer plus a trace out.
  - name: Playbook
    description: The system prompt and skills that shape every answer.
  - name: Users
    description: Tenant membership and roles.
  - name: Files
    description: Attachment upload and retrieval.

paths:
  # --------------------------------------------------------------------------
  # Meta
  # --------------------------------------------------------------------------
  /v1/health:
    get:
      operationId: getHealth
      tags: [Meta]
      summary: Liveness and dependency status
      security: []
      responses:
        "200":
          description: Service status
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        default: { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      operationId: getCurrentPrincipal
      tags: [Meta]
      summary: Who the calling key is, and what it may do
      responses:
        "200":
          description: The authenticated principal
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------------------
  # Connections
  # --------------------------------------------------------------------------
  /v1/connections:
    get:
      operationId: listConnections
      tags: [Connections]
      summary: List database connections
      description: "Required scope: `connections:read`."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
        - name: status
          in: query
          description: Filter by last-known reachability.
          schema: { $ref: "#/components/schemas/ConnectionStatus" }
      responses:
        "200":
          description: A page of connections
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createConnection
      tags: [Connections]
      summary: Register a database connection
      description: |
        Required scope: `connections:write`.

        Credentials are written to the configured secret store and referenced by
        handle. They are never returned by any endpoint, including this one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionCreate" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created connection.
              schema: { type: string }
            Idempotent-Replay: { $ref: "#/components/headers/Idempotent-Replay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /v1/connections/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      operationId: getConnection
      tags: [Connections]
      summary: Retrieve a connection
      description: "Required scope: `connections:read`."
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateConnection
      tags: [Connections]
      summary: Update a connection
      description: |
        Required scope: `connections:write`.

        Only the fields present in the body are changed. Omitted fields keep
        their current value; there is no field you can clear by omission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionUpdate" }
      responses:
        "200":
          description: The updated connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteConnection
      tags: [Connections]
      summary: Delete a connection
      description: |
        Required scope: `connections:write`. Deletes the stored credential too.
        Conversations that referenced it keep their history.
      responses:
        "204":
          description: Deleted. Deleting an already-deleted connection is also a 204.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/connections/{connection_id}/test:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      operationId: testConnection
      tags: [Connections]
      summary: Probe a connection and refresh its status
      description: |
        Required scope: `connections:read`.

        Always returns `200` with the probe outcome in the body — a database
        that is down is a fact about the world, not an error in your request.
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /v1/connections/{connection_id}/schema:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      operationId: getConnectionSchema
      tags: [Connections]
      summary: Introspect tables and columns
      description: |
        Required scope: `connections:read`. This is what the agent reads before
        writing SQL, and it is cached per connection.
      parameters:
        - name: refresh
          in: query
          description: Bypass the cache and re-introspect.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The schema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseSchema" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------------------
  # Model providers
  # --------------------------------------------------------------------------
  /v1/model-providers:
    get:
      operationId: listModelProviders
      tags: [Model providers]
      summary: List configured model providers
      description: |
        Required scope: `models:read`.

        The response also carries `presets` — the catalogue of known providers
        with their base URLs and suggested models — so a client does not have to
        hardcode values that would then drift from the server's.

        API keys are never included. `key_hint` shows the last four characters of
        the stored key so a person can tell which one is installed.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: A page of model providers, plus the preset catalogue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ModelProvider" }
                      presets:
                        type: array
                        items: { $ref: "#/components/schemas/ModelProviderPreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createModelProvider
      tags: [Model providers]
      summary: Configure a model provider
      description: |
        Required scope: `models:write` — admin only, because the choice sets what
        every question costs and which company receives the workspace's schema
        and questions.

        `api_key` is write-only. It goes to the configured secret store and is
        never returned by this or any other endpoint. The first provider added
        becomes the default.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelProviderCreate" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created provider.
              schema: { type: string }
            Idempotent-Replay: { $ref: "#/components/headers/Idempotent-Replay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/model-providers/{model_provider_id}:
    parameters:
      - name: model_provider_id
        in: path
        required: true
        schema: { type: string, examples: ["mprov_01HZX9K2"] }
    get:
      operationId: getModelProvider
      tags: [Model providers]
      summary: Retrieve a model provider
      description: "Required scope: `models:read`."
      responses:
        "200":
          description: The model provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateModelProvider
      tags: [Model providers]
      summary: Update a model provider, rotate its key, or make it the default
      description: |
        Required scope: `models:write`.

        Omit `api_key` to leave the stored key untouched. Since the key cannot be
        read back, a form that round-tripped it would overwrite the real key with
        a mask.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelProviderUpdate" }
      responses:
        "200":
          description: The updated model provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteModelProvider
      tags: [Model providers]
      summary: Remove a model provider
      description: |
        Required scope: `models:write`. Deletes the stored key too. If this was
        the default, the oldest remaining provider becomes the new default.
      responses:
        "204":
          description: Deleted. Deleting an already-deleted provider is also a 204.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/model-providers/{model_provider_id}/test:
    parameters:
      - name: model_provider_id
        in: path
        required: true
        schema: { type: string, examples: ["mprov_01HZX9K2"] }
    post:
      operationId: testModelProvider
      tags: [Model providers]
      summary: Check the credential and model without generating tokens
      description: |
        Required scope: `models:read`.

        Always returns `200` with the outcome in the body — a rejected key is a
        fact about the provider, not a malformed request.
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProviderTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------------------
  # Queries
  # --------------------------------------------------------------------------
  /v1/queries:
    post:
      operationId: createQuery
      tags: [Queries]
      summary: Execute SQL against a connection
      description: |
        Required scope: `queries:execute`.

        Read-only by default: statements that write are rejected with
        `sql_not_read_only` unless the connection's `allow_writes` is enabled.
        Results are truncated to `max_rows` and the response says so via
        `truncated`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryCreate" }
      responses:
        "201":
          description: Executed
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/Idempotent-Replay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Query" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            The SQL was rejected before execution — write statement on a
            read-only connection, or multiple statements in one request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /v1/queries/{query_id}:
    parameters:
      - name: query_id
        in: path
        required: true
        schema: { type: string, examples: ["qry_01HZX9K2"] }
    get:
      operationId: getQuery
      tags: [Queries]
      summary: Retrieve a past query and its results
      description: "Required scope: `queries:read`."
      responses:
        "200":
          description: The query
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Query" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------------------
  # Conversations
  # --------------------------------------------------------------------------
  /v1/conversations:
    get:
      operationId: listConversations
      tags: [Conversations]
      summary: List conversations
      description: "Required scope: `conversations:read`."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: A page of conversations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createConversation
      tags: [Conversations]
      summary: Start a conversation
      description: "Required scope: `conversations:write`."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationCreate" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created conversation.
              schema: { type: string }
            Idempotent-Replay: { $ref: "#/components/headers/Idempotent-Replay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      tags: [Conversations]
      summary: Retrieve a conversation
      description: "Required scope: `conversations:read`."
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateConversation
      tags: [Conversations]
      summary: Rename a conversation or switch its connection
      description: "Required scope: `conversations:write`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationUpdate" }
      responses:
        "200":
          description: The updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteConversation
      tags: [Conversations]
      summary: Delete a conversation and its messages
      description: "Required scope: `conversations:write`."
      responses:
        "204":
          description: Deleted. Deleting an already-deleted conversation is also a 204.
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }

  /v1/conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listMessages
      tags: [Conversations]
      summary: List messages in a conversation
      description: "Required scope: `conversations:read`. Oldest first by default."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: A page of messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMessage
      tags: [Conversations]
      summary: Append a message without invoking the agent
      description: |
        Required scope: `conversations:write`.

        Use this to record a message only. To ask a question and get an answer,
        create a run instead — a run appends both the question and the reply.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageCreate" }
      responses:
        "201":
          description: Created
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/Idempotent-Replay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------------------
  # Runs
  # --------------------------------------------------------------------------
  /v1/conversations/{conversation_id}/runs:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: createRun
      tags: [Runs]
      summary: Ask the agent a question
      description: |
        Required scope: `runs:write`.

        Appends the user message, runs the agent against the conversation's
        connection, and appends the reply. With `stream: true` the response is
        `text/event-stream` carrying `RunEvent` objects; otherwise it is a
        single `Run` once the answer is complete.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunCreate" }
      responses:
        "201":
          description: The completed run
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/Idempotent-Replay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent events. Each `data:` line is a JSON `RunEvent`.
                  The stream ends with an event of type `run.completed` or
                  `run.failed`.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        default: { $ref: "#/components/responses/Error" }

  /v1/runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: { type: string, examples: ["run_01HZX9K2"] }
    get:
      operationId: getRun
      tags: [Runs]
      summary: Retrieve a run and its trace
      description: "Required scope: `runs:read`."
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------------------
  # Playbook
  # --------------------------------------------------------------------------
  /v1/playbook:
    get:
      operationId: getPlaybook
      tags: [Playbook]
      summary: Retrieve the tenant playbook
      description: |
        Required scope: `playbook:read`. There is exactly one playbook per
        tenant, so it has no ID in the path.
      responses:
        "200":
          description: The playbook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playbook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: replacePlaybook
      tags: [Playbook]
      summary: Replace the playbook's system prompt
      description: "Required scope: `playbook:write`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybookReplace" }
      responses:
        "200":
          description: The updated playbook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playbook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/playbook/skills:
    get:
      operationId: listSkills
      tags: [Playbook]
      summary: List playbook skills
      description: "Required scope: `playbook:read`."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: A page of skills
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Skill" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSkill
      tags: [Playbook]
      summary: Add a skill
      description: "Required scope: `playbook:write`."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillCreate" }
      responses:
        "201":
          description: Created
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/Idempotent-Replay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/playbook/skills/{skill_id}:
    parameters:
      - name: skill_id
        in: path
        required: true
        schema: { type: string, examples: ["skl_01HZX9K2"] }
    get:
      operationId: getSkill
      tags: [Playbook]
      summary: Retrieve a skill
      description: "Required scope: `playbook:read`."
      responses:
        "200":
          description: The skill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSkill
      tags: [Playbook]
      summary: Update a skill
      description: "Required scope: `playbook:write`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillUpdate" }
      responses:
        "200":
          description: The updated skill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSkill
      tags: [Playbook]
      summary: Delete a skill
      description: "Required scope: `playbook:write`."
      responses:
        "204":
          description: Deleted. Deleting an already-deleted skill is also a 204.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------------------
  # Users
  # --------------------------------------------------------------------------
  /v1/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List tenant members
      description: "Required scope: `users:read`."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      tags: [Users]
      summary: Invite a user to the tenant
      description: "Required scope: `users:write`."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/Idempotent-Replay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, examples: ["usr_01HZX9K2"] }
    get:
      operationId: getUser
      tags: [Users]
      summary: Retrieve a user
      description: "Required scope: `users:read`."
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update a user's profile or role
      description: "Required scope: `users:write`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Remove a user from the tenant
      description: |
        Required scope: `users:write`. Removing the last admin is a `422` —
        a tenant with no admin cannot be administered back into shape.
      responses:
        "204":
          description: Removed. Removing an already-removed user is also a 204.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Would leave the tenant with no admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------------------
  # Files
  # --------------------------------------------------------------------------
  /v1/files:
    post:
      operationId: createFile
      tags: [Files]
      summary: Upload an attachment
      description: |
        Required scope: `files:write`. Send the bytes as base64 in `content`.
        The response's `download_url` is a time-limited link; treat it as
        expiring and re-fetch the file to get a fresh one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileCreate" }
      responses:
        "201":
          description: Uploaded
          headers:
            Idempotent-Replay: { $ref: "#/components/headers/Idempotent-Replay" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: The file exceeds the size limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/files/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, examples: ["file_01HZX9K2"] }
    get:
      operationId: getFile
      tags: [Files]
      summary: Retrieve file metadata and a fresh download URL
      description: "Required scope: `files:read`."
      responses:
        "200":
          description: The file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "An API key issued for a tenant, sent as `Authorization: Bearer <key>`."

  headers:
    X-Request-Id:
      description: Echo this to support — it traces the request end to end.
      schema: { type: string }
    X-RateLimit-Limit:
      description: Requests permitted in the current window.
      schema: { type: integer }
    X-RateLimit-Remaining:
      description: Requests left in the current window.
      schema: { type: integer }
    X-RateLimit-Reset:
      description: Unix seconds at which the window resets.
      schema: { type: integer }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer }
    Idempotent-Replay:
      description: Present and `true` when this response was replayed from a prior identical request.
      schema: { type: boolean }

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `next_cursor`.
      schema: { type: string }
    Order:
      name: order
      in: query
      description: |
        Sort direction. A cursor encodes the order it was created with — passing
        a cursor with a different `order` is a `400`.
      schema: { type: string, enum: [asc, desc], default: desc }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-generated unique key, e.g. a UUID. Replaying it with the same
        body returns the original response; replaying it with a different body
        is a `409`.
      schema: { type: string, minLength: 1, maxLength: 255 }
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: { type: string, examples: ["conn_01HZX9K2"] }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, examples: ["conv_01HZX9K2"] }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed, or revoked API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The key is valid but lacks the required scope or role.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource in this tenant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        The request conflicts with existing state — most often an
        `Idempotency-Key` replayed with a different body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: A dependency (the database or the model provider) failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ------------------------------------------------------------------------
    # Cross-cutting
    # ------------------------------------------------------------------------
    Error:
      type: object
      description: |
        The one error shape, used by every endpoint. `code` is stable and
        machine-readable — branch on it rather than string-matching `message`.
        New codes may be added within v1; treat an unrecognized code as generic.
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          examples: ["rate_limit_exceeded"]
        message:
          type: string
          description: Human-readable explanation. Wording may change; do not parse it.
          examples: ["Rate limit of 120 requests/min exceeded; retry after 30s."]
        details:
          type: object
          additionalProperties: true
          description: Field-level or contextual detail for self-diagnosis.
          examples: [{ "fields": [{ "path": "engine", "issue": "must be one of postgres, mysql, bigquery" }] }]
        request_id:
          type: string
          description: Trace ID for this request. Include it in support tickets.
          examples: ["req_01HZX9K2QF"]
        docs_url:
          type: string
          description: Link to documentation for this error code.

    ListEnvelope:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: {}
        has_more:
          type: boolean
          description: Whether another page exists.
        next_cursor:
          type: [string, "null"]
          description: Pass back as `cursor` for the next page. Null on the last page.

    Health:
      type: object
      required: [status, version, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: API version served by this deployment.
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string, examples: ["metadata_store"] }
              status: { type: string, enum: [ok, degraded, unavailable] }
              detail: { type: string }

    Principal:
      type: object
      required: [tenant_id, user_id, scopes, role]
      properties:
        tenant_id: { type: string, examples: ["ten_01HZX9K2"] }
        user_id: { type: string, examples: ["usr_01HZX9K2"] }
        role: { $ref: "#/components/schemas/Role" }
        scopes:
          type: array
          items: { type: string }
          examples: [["connections:read", "runs:write"]]
        api_key_id: { type: [string, "null"] }

    Role:
      type: string
      description: |
        Permission level within the tenant. Distinct from `title`, which is a
        job description and carries no permissions.
      enum: [admin, member, viewer]

    # ------------------------------------------------------------------------
    # Connections
    # ------------------------------------------------------------------------
    Engine:
      type: string
      description: |
        The database engine.

        Only engines with a shipped connector are listed. Adding a value here is
        backward compatible and happens as connectors land; removing one is not,
        so nothing is listed speculatively. Treat this as an open set and handle
        an unknown value gracefully rather than failing.
      enum: [postgres, mysql, bigquery, demo]

    ConnectionStatus:
      type: string
      enum: [connected, degraded, offline, unknown]

    Connection:
      type: object
      required:
        [id, object, name, engine, status, allow_writes, created_at, updated_at]
      properties:
        id: { type: string, examples: ["conn_01HZX9K2"] }
        object: { type: string, const: connection }
        name: { type: string, examples: ["Production"] }
        engine: { $ref: "#/components/schemas/Engine" }
        status: { $ref: "#/components/schemas/ConnectionStatus" }
        status_checked_at: { type: [string, "null"], format: date-time }
        status_detail:
          type: [string, "null"]
          description: Why the connection is degraded or offline, when known.
        allow_writes:
          type: boolean
          description: |
            When false (the default) the connector rejects any statement that
            is not read-only, before it reaches the database.
        max_rows:
          type: integer
          description: Row ceiling applied to every query on this connection.
        default_schema: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConnectionCredentials:
      type: object
      description: |
        Write-only. Supply either a `dsn` or the discrete fields for the engine.
        Whatever you send is stored in the configured secret store and is never
        returned by any endpoint.
      properties:
        dsn: { type: string, description: "Full connection string." }
        host: { type: string }
        port: { type: integer }
        database: { type: string }
        username: { type: string }
        password: { type: string }
        project_id: { type: string, description: "BigQuery only." }
        service_account_json: { type: string, description: "BigQuery only." }
        ssl: { type: boolean, default: true }

    ConnectionCreate:
      type: object
      required: [name, engine]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        engine: { $ref: "#/components/schemas/Engine" }
        credentials: { $ref: "#/components/schemas/ConnectionCredentials" }
        allow_writes: { type: boolean, default: false }
        max_rows: { type: integer, minimum: 1, maximum: 50000, default: 1000 }
        default_schema: { type: string }

    ConnectionUpdate:
      type: object
      description: Every field is optional. Omitted fields are left unchanged.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        credentials: { $ref: "#/components/schemas/ConnectionCredentials" }
        allow_writes: { type: boolean }
        max_rows: { type: integer, minimum: 1, maximum: 50000 }
        default_schema: { type: string }

    ConnectionTestResult:
      type: object
      required: [connection_id, status, checked_at]
      properties:
        connection_id: { type: string }
        status: { $ref: "#/components/schemas/ConnectionStatus" }
        checked_at: { type: string, format: date-time }
        latency_ms: { type: [integer, "null"] }
        detail: { type: [string, "null"] }

    DatabaseSchema:
      type: object
      required: [connection_id, object, tables, fetched_at]
      properties:
        connection_id: { type: string }
        object: { type: string, const: database_schema }
        fetched_at: { type: string, format: date-time }
        cached: { type: boolean }
        tables:
          type: array
          items:
            type: object
            required: [name, columns]
            properties:
              schema: { type: [string, "null"] }
              name: { type: string }
              description: { type: [string, "null"] }
              row_estimate: { type: [integer, "null"] }
              columns:
                type: array
                items:
                  type: object
                  required: [name, data_type, nullable]
                  properties:
                    name: { type: string }
                    data_type: { type: string }
                    nullable: { type: boolean }
                    primary_key: { type: boolean }
                    description: { type: [string, "null"] }

    # ------------------------------------------------------------------------
    # Model providers
    # ------------------------------------------------------------------------
    ModelProviderKind:
      type: string
      description: |
        The wire protocol the adapter speaks. `openai_compatible` covers every
        provider implementing OpenAI's Chat Completions format — Qwen, DeepSeek,
        Groq, Mistral, OpenRouter, Together, Ollama, and OpenAI itself.
      enum: [anthropic, openai_compatible]

    ModelProviderStatus:
      type: string
      description: Result of the last credential check. `unknown` until tested.
      enum: [unknown, ready, error]

    ModelProviderPreset:
      type: object
      description: |
        A known provider, with the values needed to configure it. Presets are
        added within v1 as they are supported, so treat the list as open.
      required: [id, label, kind, suggested_model, requires_base_url, key_optional]
      properties:
        id: { type: string, examples: ["qwen"] }
        label: { type: string, examples: ["Qwen (Alibaba DashScope)"] }
        kind: { $ref: "#/components/schemas/ModelProviderKind" }
        base_url:
          type: [string, "null"]
          description: Default endpoint. Null when the caller must supply one.
        suggested_model:
          type: string
          description: |
            A starting point, not a guarantee — providers rename and retire
            models on their own schedule, which is why `model` is required on
            create rather than defaulted.
        docs_url: { type: string }
        requires_base_url: { type: boolean }
        key_optional:
          type: boolean
          description: True for local runtimes that need no credential.
        note: { type: [string, "null"] }

    ModelProvider:
      type: object
      required:
        [id, object, name, provider, kind, model, is_default, status, has_key, created_at, updated_at]
      properties:
        id: { type: string, examples: ["mprov_01HZX9K2"] }
        object: { type: string, const: model_provider }
        name: { type: string, examples: ["Qwen (Alibaba DashScope) · qwen-max"] }
        provider:
          type: string
          description: Preset ID this was configured from.
          examples: ["qwen"]
        kind: { $ref: "#/components/schemas/ModelProviderKind" }
        model: { type: string, examples: ["qwen-max"] }
        base_url: { type: [string, "null"] }
        is_default:
          type: boolean
          description: Whether agent runs in this workspace use this provider.
        status: { $ref: "#/components/schemas/ModelProviderStatus" }
        status_checked_at: { type: [string, "null"], format: date-time }
        status_detail: { type: [string, "null"] }
        has_key: { type: boolean }
        key_hint:
          type: [string, "null"]
          description: |
            Last four characters of the stored key, masked. Enough to tell which
            key is installed; the key itself is never returned.
          examples: ["••••3f9a"]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ModelProviderCreate:
      type: object
      required: [provider, model]
      properties:
        provider:
          type: string
          description: A preset ID from the `presets` list.
          examples: ["qwen"]
        model: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 120 }
        base_url:
          type: string
          maxLength: 500
          description: Overrides the preset default. Required when `requires_base_url`.
        api_key:
          type: string
          maxLength: 500
          description: |
            Write-only. Stored in the secret store and never returned. Required
            unless the preset sets `key_optional`.
        is_default: { type: boolean }

    ModelProviderUpdate:
      type: object
      description: |
        Every field is optional. Omitted fields are left unchanged — in
        particular, omitting `api_key` keeps the stored key.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        model: { type: string, minLength: 1, maxLength: 200 }
        base_url: { type: string, maxLength: 500 }
        api_key:
          type: string
          maxLength: 500
          description: Write-only. Send to rotate the key.
        is_default: { type: boolean }

    ModelProviderTestResult:
      type: object
      required: [model_provider_id, status, checked_at]
      properties:
        model_provider_id: { type: string }
        status: { $ref: "#/components/schemas/ModelProviderStatus" }
        checked_at: { type: string, format: date-time }
        latency_ms: { type: [integer, "null"] }
        detail: { type: [string, "null"] }
        model_available:
          type: [boolean, "null"]
          description: |
            Whether the model appeared in the provider's catalogue. Null when the
            provider offers none. False is a warning, not a failure — several
            providers return only a partial list.

    # ------------------------------------------------------------------------
    # Queries
    # ------------------------------------------------------------------------
    QueryCreate:
      type: object
      required: [connection_id, sql]
      properties:
        connection_id: { type: string }
        sql: { type: string, minLength: 1, maxLength: 100000 }
        max_rows: { type: integer, minimum: 1, maximum: 50000 }
        timeout_ms: { type: integer, minimum: 100, maximum: 300000, default: 30000 }

    Query:
      type: object
      required: [id, object, connection_id, sql, status, created_at]
      properties:
        id: { type: string, examples: ["qry_01HZX9K2"] }
        object: { type: string, const: query }
        connection_id: { type: string }
        sql: { type: string }
        status: { type: string, enum: [succeeded, failed] }
        columns:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              data_type: { type: [string, "null"] }
        rows:
          type: array
          description: Row values in column order.
          items:
            type: array
            items: {}
        row_count: { type: integer }
        truncated:
          type: boolean
          description: True when the result hit `max_rows` and was cut short.
        duration_ms: { type: integer }
        error:
          type: [object, "null"]
          description: Populated when `status` is `failed`.
          properties:
            code: { type: string }
            message: { type: string }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------------------------------
    # Conversations and messages
    # ------------------------------------------------------------------------
    Conversation:
      type: object
      required: [id, object, title, connection_id, created_at, updated_at]
      properties:
        id: { type: string, examples: ["conv_01HZX9K2"] }
        object: { type: string, const: conversation }
        title: { type: string }
        connection_id: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        message_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConversationCreate:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        connection_id: { type: string }

    ConversationUpdate:
      type: object
      description: Every field is optional. Omitted fields are left unchanged.
      properties:
        title: { type: string, maxLength: 200 }
        connection_id: { type: string }

    Attachment:
      type: object
      required: [file_id, name, mime_type]
      properties:
        file_id: { type: string }
        name: { type: string }
        mime_type: { type: string }
        size_bytes: { type: [integer, "null"] }

    Message:
      type: object
      required: [id, object, conversation_id, role, content, created_at]
      properties:
        id: { type: string, examples: ["msg_01HZX9K2"] }
        object: { type: string, const: message }
        conversation_id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content:
          type: string
          description: |
            Markdown. Fenced blocks with the languages `sql`, `table`, `chart`,
            `mermaid`, `flow`, `status`, `diff`, and `file` are rendered by the
            workspace as interactive handlers rather than plain code.
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        run_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    MessageCreate:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, maxLength: 1000000 }
        attachments:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/Attachment" }

    # ------------------------------------------------------------------------
    # Runs
    # ------------------------------------------------------------------------
    ResponseDetail:
      type: string
      enum: [concise, balanced, detailed]

    RunCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 100000
          description: The question. May be empty only when attachments are present.
        attachments:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/Attachment" }
        connection_id:
          type: string
          description: Overrides the conversation's connection for this run only.
        response_detail: { $ref: "#/components/schemas/ResponseDetail" }
        stream:
          type: boolean
          default: false
          description: When true the response is `text/event-stream` of `RunEvent`.

    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    RunStep:
      type: object
      required: [label, status]
      properties:
        label: { type: string, examples: ["Ran query"] }
        status: { type: string, enum: [pending, active, done, failed] }
        detail: { type: [string, "null"] }
        query_id: { type: [string, "null"] }

    Run:
      type: object
      required: [id, object, conversation_id, status, created_at]
      properties:
        id: { type: string, examples: ["run_01HZX9K2"] }
        object: { type: string, const: run }
        conversation_id: { type: string }
        connection_id: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RunStatus" }
        request_message_id: { type: [string, "null"] }
        response_message_id: { type: [string, "null"] }
        content:
          type: [string, "null"]
          description: The agent's reply, in the same markdown dialect as `Message.content`.
        steps:
          type: array
          description: The trace — what the agent did, in order.
          items: { $ref: "#/components/schemas/RunStep" }
        model: { type: [string, "null"] }
        usage:
          type: [object, "null"]
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
        error:
          type: [object, "null"]
          properties:
            code: { type: string }
            message: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    RunEvent:
      type: object
      description: One server-sent event on a streaming run.
      required: [type, run_id]
      properties:
        type:
          type: string
          description: |
            New event types may be added within v1. Ignore types you do not
            recognize rather than failing.
          enum:
            [
              run.created,
              run.step,
              run.content_delta,
              run.completed,
              run.failed,
            ]
        run_id: { type: string }
        step: { $ref: "#/components/schemas/RunStep" }
        delta: { type: string, description: "Text appended to the reply." }
        run: { $ref: "#/components/schemas/Run" }
        error: { $ref: "#/components/schemas/Error" }

    # ------------------------------------------------------------------------
    # Playbook
    # ------------------------------------------------------------------------
    Playbook:
      type: object
      required: [object, system_prompt, updated_at]
      properties:
        object: { type: string, const: playbook }
        system_prompt: { type: string }
        skill_count: { type: integer }
        enabled_skill_count: { type: integer }
        updated_at: { type: string, format: date-time }

    PlaybookReplace:
      type: object
      required: [system_prompt]
      properties:
        system_prompt: { type: string, maxLength: 100000 }

    Skill:
      type: object
      required: [id, object, name, content, enabled, created_at, updated_at]
      properties:
        id: { type: string, examples: ["skl_01HZX9K2"] }
        object: { type: string, const: skill }
        name: { type: string }
        description: { type: string }
        content: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkillCreate:
      type: object
      required: [name, content]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 100000 }
        enabled: { type: boolean, default: true }

    SkillUpdate:
      type: object
      description: Every field is optional. Omitted fields are left unchanged.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 100000 }
        enabled: { type: boolean }

    # ------------------------------------------------------------------------
    # Users
    # ------------------------------------------------------------------------
    User:
      type: object
      required: [id, object, name, email, role, status, created_at]
      properties:
        id: { type: string, examples: ["usr_01HZX9K2"] }
        object: { type: string, const: user }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: string }
        title:
          type: string
          description: Job title, e.g. "Data Analyst". Carries no permissions.
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, pending] }
        created_at: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 320 }
        company: { type: string, maxLength: 120 }
        title: { type: string, maxLength: 120 }
        role: { $ref: "#/components/schemas/Role" }

    UserUpdate:
      type: object
      description: Every field is optional. Omitted fields are left unchanged.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        company: { type: string, maxLength: 120 }
        title: { type: string, maxLength: 120 }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, pending] }

    # ------------------------------------------------------------------------
    # Files
    # ------------------------------------------------------------------------
    FileCreate:
      type: object
      required: [name, mime_type, content]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        mime_type: { type: string, examples: ["image/png"] }
        content: { type: string, description: "Base64-encoded bytes." }

    File:
      type: object
      required: [id, object, name, mime_type, size_bytes, created_at]
      properties:
        id: { type: string, examples: ["file_01HZX9K2"] }
        object: { type: string, const: file }
        name: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        download_url:
          type: [string, "null"]
          description: Time-limited URL. Re-fetch the file to get a fresh one.
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
